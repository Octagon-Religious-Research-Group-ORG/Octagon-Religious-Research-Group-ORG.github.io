<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Octagon Religious-Research Group (ORG)</title>
  <meta name="description" content="Octagon Religious-Research Group and Spirituality Centers — founder Tripp Aardema." />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111111;
      text-align: center;
    }
    img.logo { width: min(260px, 60vw); height: auto; border-radius: 50%; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    p { margin: 0; color: #555555; max-width: 28rem; line-height: 1.5; }
    nav { display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; }
    a { color: #111111; }
    @media (prefers-color-scheme: dark) {
      body { background: #111111; color: #f2f2f2; }
      p { color: #bbbbbb; }
      a { color: #f2f2f2; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="ORG logo" width="260" height="260" />
  <h1>Octagon Religious-Research Group</h1>
  <p>Where science and spirituality meet.</p>
  <nav>
    <a href="https://github.com/Octagon-Religious-Research-Group-ORG">GitHub</a>
