<head>
  <meta charset="utf-8" />

  <title>Octagon Religious-Research Group (ORG)</title>
  <meta name="description" content="Octagon Religious-Research Group and Spirituality Centers. Where science and spirituality meet." />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0..100,0..1&family=Manrope:wght@400;600&family=Newsreader:opsz,wght@6..72,400&family=Hanken+Grotesk:wght@400;600&display=swap" />
  <style>
    :root {
      --bg: #f5f3fa; --fg: #221d33; --muted: #5e566e; --accent: #6b4fa0; --frame: #ffffff; --halo: #6b4fa0;
      --glow: #ffffff; --head: "Newsreader", Georgia, serif; --body: "Hanken Grotesk", system-ui, sans-serif;
      --settings: normal; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100e1c; --fg: #f4effc; --muted: #b4abc9; --accent: #e9be72; --frame: #fff8e8; --halo: #c9a4ff;
        --glow: #2a1f52; --head: "Fraunces", Georgia, serif; --body: "Manrope", system-ui, sans-serif;
        --settings: "SOFT" 60, "WONK" 1; color-scheme: dark;
      }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2.5rem 1.25rem;
      box-sizing: border-box; text-align: center; color: var(--fg); font-family: var(--body);
      background: radial-gradient(60% 55% at 50% 38%, var(--glow), var(--bg) 70%) var(--bg);
    }
    main { display: grid; justify-items: center; gap: 1.1rem; max-width: 34rem; }
    .mark { width: min(300px, 70vw); height: auto; }
    .frame { stroke: var(--frame); }
    .halo { stroke: var(--halo); opacity: .7; }
    .spin { transform-box: view-box; transform-origin: 150px 150px; animation: spin 60s linear infinite; }
    .pulse { animation: pulse 5s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: .6; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .spin, .pulse { animation: none; } }
    h1 { font-family: var(--head); font-variation-settings: var(--settings); font-weight: 400; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.08; margin: .6rem 0 0; text-wrap: balance; }
    p { margin: 0; color: var(--muted); font-size: 1.1rem; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: 1rem; }
    nav a {
      --cut: 7px; padding: .65rem 1.15rem; text-decoration: none; font-weight: 600; font-size: .95rem;
      color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent);
      clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    }
    nav a:first-child { background: var(--accent); color: var(--bg); }
    nav a:hover { color: var(--accent); }
    nav a:first-child:hover { color: var(--bg); filter: brightness(1.08); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    small { display: block; margin-top: 1.5rem; color: var(--muted); font-size: .85rem; }
    small a { color: inherit; }
  </style>
</head>
