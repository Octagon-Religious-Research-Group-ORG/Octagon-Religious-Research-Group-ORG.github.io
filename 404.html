    body {

    main { width: 100%; max-width: 32rem; text-align: center; }

    ul {

        linear-gradient(to bottom, var(--perf) 0 var(--dash), transparent 0) top left / var(--w) var(--step) repeat-y,
        linear-gradient(to bottom, var(--perf) 0 var(--dash), transparent 0) top right / var(--w) var(--step) repeat-y,
        var(--surface);
    }
    li { position: relative; }
    li + li::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: var(--w);
      background: linear-gradient(to right, var(--perf) 0 var(--dash), transparent 0) 0 0 / var(--step) var(--w) repeat-x;
    }
    a { display: flex; align-items: center; gap: 0.8rem; padding: 0.85rem 1.1rem; color: var(--fg); text-decoration: none; }
    a:hover { background: var(--surface-2); color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .ph { color: var(--accent); font-size: 1.3rem; }
    li:first-child a { font-weight: 700; }
